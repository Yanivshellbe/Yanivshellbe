server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/money-machine/dashboard;
    index index.html;

    # Static dashboard + JSON state written by the orchestrator.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
    }

    # state.json and data/*.json must never be cached so the dashboard sees live updates.
    location ~* \.(json)$ {
        add_header Cache-Control "no-store";
    }
}
